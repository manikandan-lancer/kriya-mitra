services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kriya_postgres
    environment:
      POSTGRES_USER: kriya
      POSTGRES_PASSWORD: kriya
      POSTGRES_DB: kriya_mitra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kriya -d kriya_mitra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kriya_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
